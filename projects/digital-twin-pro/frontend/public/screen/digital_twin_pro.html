/* ═══════════════════════════════════════════════════════════════
   数字孪生 Pro 主题系统 — 深色科技风 + 玻璃质感 + 霓虹光效
   ═══════════════════════════════════════════════════════════════ */
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #111827;
  --bg-panel: rgba(17, 24, 39, 0.75);
  --bg-glass: rgba(17, 24, 39, 0.55);
  --border-neon: rgba(34, 211, 238, 0.28);
  --border-glass: rgba(255, 255, 255, 0.06);
  --glow-cyan: 0 0 20px rgba(34, 211, 238, 0.12);
  --glow-blue: 0 0 20px rgba(6, 182, 212, 0.1);
  --text-primary: #e8edf5;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-cyan: #22d3ee;
  --accent-blue: #06b6d4;
  --accent-amber: #64748b;
  --accent-red: #ef4444;
  --accent-green: #64748b;
  --accent-purple: #64748b;
  --font-mono: 'SF Mono','Fira Code','Consolas',monospace;
  --font-sans: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --sidebar-w: 400px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html,body { width: 100%; height: 100%; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); overflow: hidden; user-select: none; }

/* ── 背景粒子 Canvas ── */
#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* ── 主布局 ── */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr var(--sidebar-w); grid-template-rows: 1fr; grid-template-areas: 'map sidebar'; width: 100%; height: 100%; }

/* ── 地图区 ── */
#map-area { grid-area: map; position: relative; overflow: hidden; background: var(--bg-primary); }
#map-chart { width: 100%; height: 100%; }
/* ScanRing 叠加层：克制商务风下停用（保留 DOM 便于结构稳定，display:none 隐藏） */
#scan-ring-canvas { display: none; }

/* ── 地图控件 ── */
.map-controls { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
.map-controls button {
  padding: 7px 16px; border: 1px solid var(--border-neon); border-radius: 6px;
  background: var(--bg-glass); backdrop-filter: blur(12px); color: var(--text-secondary);
  font-size: 12px; cursor: pointer; transition: all 0.25s; font-family: var(--font-sans);
}
.map-controls button:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); box-shadow: var(--glow-cyan); background: rgba(34,211,238,0.06); }
.map-controls button.active { border-color: var(--accent-cyan); color: var(--accent-cyan); background: rgba(34,211,238,0.08); }

/* ── 侧边栏 ── */
#sidebar { grid-area: sidebar; display: flex; flex-direction: column; background: var(--bg-secondary); border-left: 1px solid var(--border-glass); overflow: hidden; position: relative; }
.sidebar-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border-glass); flex-shrink: 0; }
.sidebar-header h1 { font-size: 15px; font-weight: 600; background: linear-gradient(135deg,var(--accent-cyan),var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 1px; }
.sidebar-header .sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-family: var(--font-mono); }
.sidebar-header .live-badge { display: inline-block; font-size: 10px; color: var(--text-muted); margin-left: 8px; }

/* 年份切换 Tabs */
.year-tabs { display: flex; gap: 0; padding: 10px 20px; border-bottom: 1px solid var(--border-glass); flex-shrink: 0; }
.year-tab { flex: 1; padding: 6px 0; text-align: center; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; border: 1px solid transparent; border-radius: 4px; transition: all 0.25s; background: transparent; font-family: var(--font-sans); }
.year-tab:first-child { border-right: none; }
.year-tab.active { color: var(--accent-cyan); border-color: var(--border-neon); background: rgba(34,211,238,0.05); box-shadow: var(--glow-cyan); }
.year-tab:hover:not(.active) { color: var(--text-secondary); }

/* 指标切换 */
.metric-tabs { display: flex; gap: 0; padding: 0 20px 10px; flex-shrink: 0; }
.metric-tab { flex: 1; padding: 5px 0; text-align: center; font-size: 12px; color: var(--text-muted); cursor: pointer; border: 1px solid transparent; border-radius: 4px; transition: all 0.25s; background: transparent; font-family: var(--font-sans); }
.metric-tab:first-child { border-right: none; }
.metric-tab.active { color: var(--accent-blue); border-color: rgba(6,182,212,0.25); background: rgba(6,182,212,0.05); }
.metric-tab:hover:not(.active) { color: var(--text-secondary); }

/* ── 滚动内容区 ── */
.sidebar-scroll { flex: 1; overflow-y: auto; padding: 0 20px 20px; }
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }

.kpi-card {
  background: var(--bg-glass); backdrop-filter: blur(8px); border: 1px solid var(--border-glass);
  border-radius: 8px; padding: 14px; position: relative; overflow: hidden; transition: all 0.3s;
}
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg,transparent,var(--accent-cyan),transparent); opacity: 0.4; }
.kpi-card:hover { border-color: var(--border-neon); }
.kpi-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.kpi-value { font-size: 20px; font-weight: 700; font-family: var(--font-mono); color: var(--accent-cyan); letter-spacing: -0.5px; }
.kpi-unit { font-size: 11px; color: var(--text-muted); font-weight: 400; margin-left: 2px; }
.kpi-yoy { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; margin-top: 4px; padding: 1px 6px; border-radius: 3px; }
.kpi-yoy.up { color: var(--accent-cyan); background: rgba(34,211,238,0.08); }
.kpi-yoy.down { color: var(--accent-red); background: rgba(239,68,68,0.1); }
.kpi-sparkline { margin-top: 6px; height: 16px; opacity: 0.6; }

/* ── 面板标题 ── */
.panel-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px; }
.panel-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg,var(--border-glass),transparent); }

/* ── 排名列表 ── */
.rank-list { list-style: none; }
.rank-item { display: flex; align-items: center; padding: 7px 10px; margin-bottom: 3px; border-radius: 6px; background: var(--bg-glass); border: 1px solid transparent; transition: all 0.2s; cursor: default; }
.rank-item:hover { border-color: rgba(34,211,238,0.15); background: rgba(34,211,238,0.04); }

.rank-name { flex: 1; font-size: 13px; color: var(--text-primary); }
.rank-cat { font-size: 10px; color: var(--text-muted); margin-left: 6px; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,0.04); }

.rank-bar { height: 100%; border-radius: 2px; transition: width 0.6s cubic-bezier(0.22,1,0.36,1); }
.rank-val { width: 60px; flex-shrink: 0; text-align: right; font-size: 11px; font-family: var(--font-mono); color: var(--text-secondary); }

/* ── 结构饼图 ── */
.structure-wrap { display: flex; align-items: center; gap: 14px; padding: 10px 0; }
.structure-svg { flex-shrink: 0; }
.structure-svg path { transition: d 0.5s ease; }
.structure-legend { flex: 1; }
.structure-legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.structure-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.structure-legend-label { flex: 1; font-size: 12px; color: var(--text-secondary); }
.structure-legend-val { font-size: 12px; font-family: var(--font-mono); color: var(--text-primary); text-align: right; }

/* ── FPS 监控 ── */
#fps-counter { position: fixed; top: 12px; right: 412px; z-index: 100; font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); pointer-events: none; }

/* ── 错误提示 ── */
#error-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 10px 24px; border-radius: 8px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: var(--accent-red); font-size: 13px; backdrop-filter: blur(12px); display: none; white-space: nowrap; }

/* ── 加载动画 ── */
.loading-overlay { position: fixed; inset: 0; z-index: 9999; background: var(--bg-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s,visibility 0.8s; }
.loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loading-ring { width: 60px; height: 60px; border: 2px solid transparent; border-top: 2px solid var(--accent-cyan); border-right: 2px solid var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { margin-top: 20px; font-size: 13px; color: var(--text-muted); font-family: var(--font-mono); letter-spacing: 2px; }
.loading-bar { width: 200px; height: 2px; background: rgba(255,255,255,0.06); border-radius: 1px; margin-top: 12px; overflow: hidden; }
.loading-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg,var(--accent-cyan),var(--accent-blue)); border-radius: 1px; transition: width 0.5s; }

/* ── Three.js 弹窗 ── */
.modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(13,17,23,0.9); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal-content { width: 92vw; height: 92vh; background: var(--bg-secondary); border: 1px solid var(--border-neon); border-radius: 12px; box-shadow: 0 0 60px rgba(34,211,238,0.08); position: relative; overflow: hidden; }

<script>
/* ═══════════════════════════════════════════════════════════════
   数字孪生 Pro — 事件驱动架构 + 实时数据 + 高级视觉效果
   ═══════════════════════════════════════════════════════════════ */

// ── 工具函数 ──
const fmtNum = (n) => {
  if (n == null || isNaN(n)) return '--';
  if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
  return n.toLocaleString('zh-CN');
};
const fmtNumRaw = (n) => n == null || isNaN(n) ? '--' : n.toLocaleString('zh-CN',{maximumFractionDigits:1});
const clamp = (v,min,max) => Math.max(min,Math.min(max,v));

// ── 全局 ErrorBoundary ──
(function initErrorBoundary() {
  const toast = document.getElementById('error-toast');
  let timer = null;
  const show = (msg) => {
    toast.textContent = '⚠ ' + (msg || '未知错误');
    toast.style.display = 'block';
    clearTimeout(timer);
    timer = setTimeout(() => { toast.style.display = 'none'; }, 5000);
  };
  window.addEventListener('error', (e) => { show(e.message || 'Runtime Error'); console.error('[ErrorBoundary]', e); });
  window.addEventListener('unhandledrejection', (e) => { show(e.reason?.message || 'Unhandled Promise'); console.error('[ErrorBoundary]', e); });
  window.__showError = show;
})();

// ── FPS 计数器（仅 ?debug 模式启用；生产环境隐藏，避免常驻 rAF 开销与视觉干扰）──
(function initFPS() {
  const el = document.getElementById('fps-counter');
  if (!new URLSearchParams(location.search).has('debug')) {
    if (el) el.style.display = 'none';
    return;
  }
  let frames = 0, last = performance.now();
  const tick = () => {
    frames++;
    const now = performance.now();
    if (now - last >= 1000) {
      el.textContent = frames + ' FPS';
      frames = 0; last = now;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();

// ── 全局配置：后端 API 地址可配置化（消除硬编码） ──
// 覆盖方式（优先级从高到低）：
//   1. URL 参数 ?apiBase=http://host:port
//      例：http://127.0.0.1:8000/digital_twin_pro.html?apiBase=http://192.168.1.5:8001
//   2. 全局变量 window.__AGRI_API_BASE__（在页面脚本之前注入，例如先执行
//      window.__AGRI_API_BASE__ = 'http://192.168.1.5:8001' 再加载本页面）
//   3. 默认值 http://127.0.0.1:8001（本机开发后端）
// 所有 API 请求地址与数据源指示器展示均由该常量统一拼接生成。
const APP_CONFIG = (() => {
  const DEFAULT_API_BASE = ''; // 同源：走 vite dev proxy（/api → 8001），生产/远程用 ?apiBase 覆盖
  let apiBase = window.__AGRI_API_BASE__ || DEFAULT_API_BASE;
  // URL 参数 ?apiBase=... 优先级最高（去掉尾部斜杠，避免拼接出双斜杠）
  try {
    const p = new URLSearchParams(window.location.search).get('apiBase');
    if (p) apiBase = String(p).replace(/\/+$/, '');
  } catch (e) { /* URL 解析失败时忽略，回退到下一优先级 */ }
  return {
    apiBase,
    apiTimeoutMs: 4000,
    get apiUrl() { return this.apiBase + '/api/dashboard'; },
  };
})();

// ── DataStore: 增强版状态管理 + 事件总线 ──
const DataStore = (() => {
  const _state = {
    year: 2024, metric: 'production', mapRotating: false,
    rawData: null, dataSource: null, _loading: false, _ready: false,
    // 实时数据历史
    _history: { total_production: [], total_area: [], food_production_pct: [], economic_production_pct: [] },
    _realtimeInterval: null,
  };
  const _listeners = new Map();

  return {
    get(key) { return _state[key]; },
    set(key, val) {
      const old = _state[key];
      if (old === val) return;
      _state[key] = val;
      this.emit('change:' + key, val, old);
      this.emit('change', { key, val, old });
    },
    on(event, fn) {
      if (!_listeners.has(event)) _listeners.set(event, new Set());
      _listeners.get(event).add(fn);
      return () => _listeners.get(event)?.delete(fn);
    },
    emit(event, ...args) {
      _listeners.get(event)?.forEach(fn => fn(...args));
    },
    getKPI() { const d = _state.rawData; return d ? d.kpi[_state.year] : null; },
    getYoY() { const d = _state.rawData; return d ? d.yoy : null; },
    getCategories() { const d = _state.rawData; return d ? d.categories[_state.year] : null; },
    getRankings() {
      const d = _state.rawData;
      if (!d) return null;
      const key = _state.metric === 'production' ? 'production_by_crop' : 'area_by_crop';
      return d[key][_state.year];
    },
    getProvinceData() {
      const d = _state.rawData;
      if (!d) return null;
      return d.province.filter(p => p.year === _state.year && p.province !== '全国');
    },
    getHistory(key) { return _state._history[key] || []; },
    // 实时数据引擎
    startRealtime() {
      if (_state._realtimeInterval) return;
      _state._realtimeInterval = setInterval(() => {
        const kpi = this.getKPI();
        if (!kpi) return;
        // 对每个 KPI 生成 ±2% 波动
        const keys = ['total_production','total_area','food_production_pct','economic_production_pct'];
        keys.forEach(k => {
          const delta = (Math.random() - 0.5) * 0.04; // ±2%
          const newVal = kpi[k] * (1 + delta);
          kpi[k] = Math.max(0, newVal);
          // 写入历史
          const hist = _state._history[k];
          hist.push(kpi[k]);
          if (hist.length > 20) hist.shift();
        });
        this.emit('realtime:update', kpi);
      }, 3000);
    },
    stopRealtime() {
      if (_state._realtimeInterval) {
        clearInterval(_state._realtimeInterval);
        _state._realtimeInterval = null;
      }
    },
    async load() {
      if (_state._loading) return;
      _state._loading = true;
      // ── 模式C：后端 API 优先，静态文件兜底 ──
      // 请求地址由 APP_CONFIG 统一管理：?apiBase 参数 > window.__AGRI_API_BASE__ > 默认值
      const API_URL = APP_CONFIG.apiBase + '/api/dashboard';
      const STATIC_URL = 'dashboard_data.json';
      const fetchWithTimeout = (url, ms = APP_CONFIG.apiTimeoutMs) => {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), ms);
        return fetch(url, { signal: ctrl.signal, cache: 'no-store' })
          .finally(() => clearTimeout(timer));
      };
      const loadJson = async (url) => {
        const resp = await fetchWithTimeout(url);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        return resp.json();
      };
      let lastErr = null;
      // 1) 优先后端 API（实时数据）
      try {
        const data = await loadJson(API_URL);
        _state.rawData = data;
        _state.dataSource = 'api';
        console.log('[DataStore] 数据源: 后端 API (' + API_URL + ')');
        _state._ready = true;
        this.emit('ready');
        return;
      } catch (err) {
        lastErr = err;
        console.warn('[DataStore] API 不可用，回退静态文件:', err.message || err);
      }
      // 2) 兜底静态 JSON（离线 / 后端未启动时可用）
      for (let i = 0; i < 3; i++) {
        try {
          const data = await loadJson(STATIC_URL);
          _state.rawData = data;
          _state.dataSource = 'static';
          console.log('[DataStore] 数据源: 本地静态文件 (dashboard_data.json)');
          _state._ready = true;
          this.emit('ready');
          return;
        } catch (err) {
          lastErr = err;
          console.warn('[DataStore] 静态加载重试 ' + (i+1) + '/3:', err.message);
          if (i < 2) await new Promise(r => setTimeout(r, (i+1) * 500));
        }
      }
      throw lastErr || new Error('数据加载失败');
    },
    getDataSource() { return _state.dataSource; },
    isReady() { return _state._ready; },
  };
})();

// ── 数字动画 ──
const _animFrames = {};
const animateNumber = (el, target, suffix = '', duration = 800) => {
  const key = el.dataset.animKey || (el.dataset.animKey = Math.random().toString(36).slice(2));
  if (_animFrames[key]) { cancelAnimationFrame(_animFrames[key]); delete _animFrames[key]; }
  const start = performance.now();
  const from = parseFloat(el.dataset.lastVal) || 0;
  el.dataset.lastVal = target;
  if (from === target) return;
  const tick = (now) => {
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = from + (target - from) * eased;
    el.textContent = fmtNum(val) + suffix;
    if (t < 1) _animFrames[key] = requestAnimationFrame(tick);
    else { el.textContent = fmtNum(target) + suffix; delete _animFrames[key]; }
  };
  _animFrames[key] = requestAnimationFrame(tick);
};

// ── 背景粒子 Canvas 增强版 ──
const initBgCanvas = () => {
  const canvas = document.getElementById('bg-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  let w, h, particles = [];
  const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
  const create = () => {
    particles = [];
    for (let i = 0; i < 100; i++) {
      particles.push({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.2,
        r: Math.random() * 2 + 0.5,
        a: Math.random() * 0.3 + 0.1,
        hue: Math.random() < 0.5 ? 170 : 220, // 青/蓝
      });
    }
  };
  resize(); create();
  const draw = () => {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue},80%,60%,${p.a})`;
      ctx.fill();
    });
    // 连线
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(34,211,238,${0.05 * (1 - dist / 120)})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  };
  draw();
  window.addEventListener('resize', () => { resize(); create(); });
};

    '青海':[101.8,36.6],'宁夏':[106.3,38.5],'新疆':[87.6,43.8],

  // 省份名规范化：GeoJSON properties.name 是全名（如“山东省”），dashboard 的 province 是简称（如“山东”）
  const normalizeName = (n) => String(n || '')
    .replace(/特别行政区$/, '')
    .replace(/(维吾尔|壮族|回族)?自治区$/, '')
    .replace(/[省市]$/, '');

  // 产量 -> 柱高：sqrt 压缩（黑龙江/西藏极差大），z ∈ [1, 8]
  const barHeightOf = (v, maxV) => 1 + Math.sqrt(Math.max(v, 0) / maxV) * 7;

  const filterValid = (data, metric) =>
    data.filter(p => { const v = metric === 'production' ? p.production : p.area; return v != null && v > 0; });

  const getMapData = () => {
    const raw = DataStore.getProvinceData();
    if (!raw) return [];
    const valid = filterValid(raw, DataStore.get('metric'));
    const metric = DataStore.get('metric');
    return valid.map(p => ({
      name: p.provinceFull,
      value: metric === 'production' ? p.production : p.area,
      province: p.province,
    }));
  };

  const getColorRange = (metric) => {
    // 青色单色系（深青 → 亮青），克制商务风；色块不透明度整体提高（geo3D regions 着色后低透明度会偏暗）
    return ['rgba(6,182,212,0.4)','rgba(6,182,212,0.6)','rgba(34,211,238,0.75)','rgba(103,232,249,0.95)'];
  };

  // rgba 字符串 -> [r,g,b,a]
  const parseRGBA = (s) => {
    const m = s.match(/rgba?\(([\d.]+),([\d.]+),([\d.]+)(?:,([\d.]+))?\)/);
    return [parseFloat(m[1]), parseFloat(m[2]), parseFloat(m[3]), m[4] != null ? parseFloat(m[4]) : 1];
  };
  // hex 颜色 -> [r,g,b,a]（霓虹三段渐变使用）
  const hexToRGBA = (hex, a = 1) => {
    const h = String(hex).replace('#', '');
    const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
    return [parseInt(n.slice(0, 2), 16), parseInt(n.slice(2, 4), 16), parseInt(n.slice(4, 6), 16), a];
  };
  // 在 stops 梯度上按 t(0..1) 插值出 rgba 颜色
  const lerpColor = (stops, t) => {
    t = Math.max(0, Math.min(1, t));
    const seg = Math.min(stops.length - 2, Math.floor(t * (stops.length - 1)));
    const f = t * (stops.length - 1) - seg;
    const a = stops[seg], b = stops[seg + 1];
    return `rgba(${Math.round(a[0] + (b[0] - a[0]) * f)},${Math.round(a[1] + (b[1] - a[1]) * f)},${Math.round(a[2] + (b[2] - a[2]) * f)},${(a[3] + (b[3] - a[3]) * f).toFixed(3)})`;
  };

  // 生成飞线数据：仅保留产量 Top7 主干省份（克制商务风：精简飞线密度，保留产量语义）
  const getFlylineData = () => {
    const zMin = 1; // 省份端贴地（与最小柱同高度，避免 altitude 轴外推下沉）
    if (!_lastBarData || !_lastBarData.length) return [];
    const topBars = _lastBarData
      .slice()
      .sort((a, b) => (b.production != null ? b.production : -1) - (a.production != null ? a.production : -1))
      .slice(0, 7);
    let prodMax = 1;
    topBars.forEach(d => { if (d.production != null && d.production > prodMax) prodMax = d.production; });
    const data = [];
    topBars.forEach((d) => {
      const prov = d.name;
      const c = _coordByName[normalizeName(prov)] || PROVINCE_CENTERS[prov];
      if (!c) return;
      const zTop = _lastBarZMap && _lastBarZMap[prov] != null
        ? _lastBarZMap[prov]
        : (d.value ? d.value[2] : 1);
      const t = Math.max(0, Math.min(1, (d.production != null ? d.production : 1) / prodMax));
      data.push({
        coords: [[d.value[0], d.value[1], zTop + 0.4], [c[0], c[1], zMin]],
        lineStyle: {
          color: '#22d3ee',
          opacity: 0.2 + 0.4 * t,
          width: 0.8 + 1.4 * t,
        },
      });
    });
    return data;
  };
  let _lastBarZMap = null; // 供 getFlylineData 复用当前柱高（实时脉冲后同步更新）

  const render = async () => {
    const id = ++_updateId;
    if (_growTimer) { clearInterval(_growTimer); _growTimer = null; }
    const dom = document.getElementById('map-chart');
    // 性能：固定 devicePixelRatio=1（webgl 渲染 + 1x 输出，降低 GL 像素填充开销）
    if (!chart) chart = echarts.init(dom, null, { renderer: 'webgl', devicePixelRatio: 1 });

    if (!geoJSON) {
      try {
        // 关键坑：vite.config proxy 同时代理 /api 与 /vendor 到后端，/vendor/china.json 会被转发而非命中 public；
        // 必须改为 /screen/vendor/china.json（/screen 不在 proxy 规则，命中 public 静态资源）。
        const resp = await fetch(APP_CONFIG.apiBase + '/screen/vendor/china.json');
        geoJSON = await resp.json();
        echarts.registerMap('china', geoJSON);
      } catch (e) {
        console.error('GeoJSON 加载失败:', e);
        return;
      }
    }
    if (id !== _updateId) return;

    const mapData = getMapData();
    const values = mapData.map(d => d.value).filter(v => v > 0);
    const maxVal = values.length > 0 ? Math.max(...values) : 1;
    const minVal = values.length > 0 ? Math.min(...values) : 0;
    const metric = DataStore.get('metric');
    const label = metric === 'production' ? '产量' : '面积';
    const unit = metric === 'production' ? '吨' : '亩';

    const valueByName = {};
    mapData.forEach(d => {
      valueByName[normalizeName(d.name)] = d.value;
      valueByName[normalizeName(d.province)] = d.value;
    });

    // 省份中心质心（geoJSON properties.centroid / center 优先，多边形坐标均值兜底）
    const centroidOfFeature = (f) => {
      const p = f.properties || {};
      if (p.centroid) return p.centroid;
      if (p.center) return p.center;
      const coords = f.geometry && f.geometry.coordinates;
      if (!coords) return null;
      const flat = [];
      const walk = (c) => { if (typeof c[0] === 'number') flat.push(c); else c.forEach(walk); };
      walk(coords);
      if (!flat.length) return null;
      const s = flat.reduce((acc, c) => [acc[0] + c[0], acc[1] + c[1]], [0, 0]);
      return [s[0] / flat.length, s[1] / flat.length];
    };
    // 简称 -> [lng,lat]：geoJSON 质心优先，省会常量兜底（柱体 / 飞线 / 聚焦共用）
    _coordByName = {};
    geoJSON.features.forEach(f => {
      const c = centroidOfFeature(f);
      if (c) _coordByName[normalizeName(f.properties.name)] = c;
    });

    // geo3D 组件自身渲染各省色块：按 metric 值在渐变色带上插值出每省颜色
    const regionStops = getColorRange(metric).map(parseRGBA);
    const valSpan = maxVal - minVal;
    const regionStyles = geoJSON.features.map(f => {
      const v = valueByName[normalizeName(f.properties.name)] || 0;
      const t = valSpan > 0 ? (v - minVal) / valSpan : 0;
      return { name: f.properties.name, itemStyle: { color: lerpColor(regionStops, t) } };
    });

    // ── bar3D 柱状森林：每省 1 柱，高度 = 产量（sqrt 压缩），青→蓝渐变玻璃材质 ──
    // echarts-gl 2.0.9 决策（源码实证）：
    //   · geo3D 的 altitudeAxis 仅在存在带 alt 维度的 series 时创建，bar3D 数据 [lng,lat,z] 触发之；
    //   · bar3D 底 = altitudeAxis.scale.getExtent()[0]（全 series 最小 z），柱高 = dataToCoord(z) ∈ [0, boxHeight-regionHeight]；
    //   · lines3D 数据只有 'value' 维，不参与 altitude 范围，飞线 coords 第三维仍会被 altitude 轴解释（起点=柱顶可行）；
    //   · bar3D 每数据项 itemStyle.color/opacity 经 visual 写入顶点色（getItemVisualColor/Opacity），故逐柱渐变 + hover 透明度可改；
    //   · bar3D 内建 mousemove 高亮（emphasis.itemStyle.color，缺省用 color.lift(-0.4) 会变暗 → 必须显式给亮色）；
    //   · viewControl.center 是 world 坐标（OrbitControl._center.setArray），聚焦需 coordSys.dataToPoint 换算。
    // 因此移除原 scatter3D tooltip 覆盖层，tooltip/click 全部由 bar3D 承担（四系列减为三，性能更稳）。
    const provMeta = {};
    (DataStore.getProvinceData() || []).forEach(p => { provMeta[p.province] = p; });
    // 产量分档渐变（深青 → 亮青）：低产深青 → 中产主青 → 高产亮青（青色单色系，克制商务风）
    const barStops = [
      [6, 182, 212, 1],    // 深青 #06b6d4
      [34, 211, 238, 1],   // 主青 #22d3ee
      [103, 232, 249, 1],  // 亮青 #67e8f9
    ];
    // ── 环形布局：柱环围绕地图外围（同心圆等距，N=有效省份数）──
    // 半径取世界单位 46（boxWidth 76 → 地图半宽 38），环位于地图外缘外 8 单位；
    // 角度从正北起顺时针等分，避免遮挡地图主体（配合 viewControl 距离放大）。
    const RING_R = 46;
    const ringCenter = (() => {
      const ll = Object.keys(_coordByName).map(k => _coordByName[k]);
      if (!ll.length) return [104, 36];
      const xs = ll.map(c => c[0]), ys = ll.map(c => c[1]);
      return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2];
    })();
    const barData = [];
    const labelData = [];   // 柱顶悬浮标签（省名 + 产量，LOD 近显远隐）
    _lastBarZMap = {};
    _lastBarBaseZ = [];
    _lastLabelData = null;
    const nBars = mapData.length;
    mapData.forEach((d, i) => {
      const prov = d.province || d.name;
      const c = _coordByName[normalizeName(prov)] || PROVINCE_CENTERS[prov];
      if (!c) return;
      const z = barHeightOf(d.value, maxVal);
      const t = maxVal > 0 ? Math.sqrt(Math.max(d.value, 0) / maxVal) : 0;
      _lastBarZMap[prov] = z;
      const meta = provMeta[prov] || {};
      const color = lerpColor(barStops, t);
      // 环形坐标：角度 = i/N*2π（正北起顺时针），半径 = RING_R 世界单位
      const a = (i / nBars) * Math.PI * 2 - Math.PI / 2;
      const rx = ringCenter[0] + RING_R * Math.cos(a);
      const rz = ringCenter[1] + RING_R * Math.sin(a);
      const barIdx = barData.length; // 有效柱索引（过滤掉无坐标省份后重排）
      barData.push({
        name: prov,
        value: [rx, rz, z],
        production: meta.production,
        area: meta.area,
        mainCrop: meta.mainCrop || meta.top_crop || null,
        _barIdx: barIdx,
        itemStyle: { color, opacity: 0.95 },
      });
      _lastBarBaseZ.push(z);
      // （已移除麦粒拟态层/皇冠光晕层：专业扁平化，柱顶标签即视觉焦点）
      // 柱顶标签：省名 + 产量（万吨）
      labelData.push({
        name: prov, _barIdx: barIdx, _dz: 1.7,
        provinceFull: meta.provinceFull || prov,
        production: meta.production,
        value: [rx, rz, z + 1.7],
        symbolSize: 0.01,
        itemStyle: { opacity: 0 },
      });
    });
    _lastBarData = barData;
    _lastLabelData = labelData;

    // bar3D tooltip：省名 + 产量(万吨) + 面积(万亩) + 主产作物（等宽数字）
    const barTooltipHtml = (d) => {
      const name = d.name || d.province || '';
      const prod = d.production, area = d.area;
      const row = (k, v) =>
        `<div style="display:flex;justify-content:space-between;gap:18px"><span style="color:#94a3b8">${k}</span><span>${v}</span></div>`;
      return '<div style="font-variant-numeric:tabular-nums;min-width:168px">'
        + `<div style="font-size:13px;font-weight:600;margin-bottom:5px">${name}</div>`
        + row('产量', `${fmtNumRaw(prod != null ? prod / 1e4 : 0)} 万吨`)
        + row('面积', `${fmtNumRaw(area != null ? area / 1e4 : 0)} 万亩`)
        + row('主产', d.mainCrop || '--')
        + '</div>';
    };

    // 单次 setOption 一次性提交 geo3D 组件（含各省色块 regions）+ lines3D + bar3D，
    // 共享同一个显式 geo3D 坐标系（map3D 系列自建坐标系不与 lines3D 共存，会抛 geo "0" not found）
    const regionHeight = metric === 'production' ? 1 : 0.8;
    const series = [];
    // lines3D 柱↔地图飞线：起点=环形柱顶，终点=省份质心，青色发光（与 effect 风格统一）
    series.push({
      id: 'lines3d',
      type: 'lines3D',
      coordinateSystem: 'geo3D',
      // echarts-gl lines3D 不支持 large 批量合并；已精简为 Top7 主干飞线，7 条线开销可忽略
      effect: {
        show: _flylineEnabled,
        trailWidth: 2, trailLength: 0.3, trailOpacity: 0.6, trailColor: '#22d3ee',
        period: 3.2, spotIntensity: 1.5,
      },
      lineStyle: { width: 1.2, opacity: 0.4, color: 'rgba(34,211,238,0.6)' },
      data: _flylineEnabled ? getFlylineData() : [],
    });
    // bar3D 柱状森林：环形围绕地图，深青→亮青产量渐变 + 小圆角收边
    series.push({
      id: 'province-bars',
      type: 'bar3D',
      coordinateSystem: 'geo3D',
      barSize: 3.6,
      bevelSize: 0.3,          // 克制风：圆角收边 1.6 → 0.3（几何细分更少，渲染更省）
      bevelSmoothness: 2,
      shading: 'realistic',    // PBR 明暗立体感（echarts-gl 2.0.9 内置 ecgl.realistic 着色器）
      minHeight: 0.3,
      itemStyle: { opacity: 0.95 },
      label: { show: false },  // 省名/产量由 scatter3D 标签层承载（LOD 近显远隐）
      emphasis: {
        label: {
          show: true, distance: 2,
          formatter: (p) => p.name || '',
          textStyle: { color: '#ffffff', fontSize: 13, textShadowColor: 'rgba(0,0,0,0.7)', textShadowBlur: 4 },
        },
        itemStyle: { color: '#a5f3fc', opacity: 1 },
      },
      data: barData,
      tooltip: { formatter: (p) => barTooltipHtml(p.data || {}) },
    });
    // ── scatter3D 柱顶标签层：省名 + 产量（万吨），LOD 近显远隐由 interval 轮询控制 ──
    series.push({
      id: 'bar-labels',
      type: 'scatter3D',
      coordinateSystem: 'geo3D',
      symbolSize: 0.01,
      silent: true,
      itemStyle: { opacity: 0 },
      label: {
        show: true,
        distance: 4,
        formatter: (p) => {
          const d = p.data || {};
          const prod = d.production != null ? (d.production / 1e4).toLocaleString('zh-CN', { maximumFractionDigits: 1 }) : '--';
          return (d.provinceFull || d.name || '') + '  ' + prod + '万吨';
        },
        textStyle: {
          color: '#cffafe', fontSize: 11, fontWeight: 'bold',
          textShadowColor: 'rgba(0,0,0,0.9)', textShadowBlur: 5,
        },
      },
      data: labelData,
    });

    chart.setOption({
      tooltip: {
        trigger: 'item',
        extraCssText: 'backdrop-filter: blur(12px); border-radius:8px; box-shadow:0 4px 24px rgba(0,0,0,0.45); font-variant-numeric: tabular-nums;',
        formatter: (p) => {
          // bar3D 柱状森林（主交互层）
          if (p.seriesType === 'bar3D') return barTooltipHtml(p.data || {});
          const d = p.data || {};
          const v = d.value || 0;
          if (v <= 0) return `<strong>${d.name || p.name}</strong><br/>数据暂缺`;
          return `<strong>${d.name || p.name}</strong><br/>${label}：${fmtNumRaw(v)} ${unit}`;
        },
        backgroundColor: 'rgba(13,17,23,0.88)',
        borderColor: 'rgba(34,211,238,0.3)',
        textStyle: { color: '#e8edf5', fontSize: 13 },
      },
      visualMap: {
        min: minVal, max: maxVal,
        text: ['高','低'],
        textStyle: { color: '#64748b' },
        inRange: { color: getColorRange(metric) },
        calculable: true,
        left: 'left', bottom: 40,
        itemWidth: 12, itemHeight: 100,
        seriesIndex: 99, // 仅作图例展示；地图色块已由 geo3D regions 逐省着色，柱体颜色由 itemStyle 渐变控制
      },
      geo3D: {
        id: 'geo3d',
        map: 'china',
        regions: regionStyles,
        // silent: 区域 mesh 在 echarts-gl 2.0.9 中无法出 tooltip（seriesIndex 缺失），
        // 关闭区域 picking 后，hover/click 必然命中 bar3D 柱体。
        silent: true,
        shading: 'lambert',
        boxWidth: 76,          // 缩小盒体：让环形柱（世界半径 46）落在地图外缘外，整体入镜
        boxHeight: 8,
        regionHeight: regionHeight,
        environment: '#0d1117',
        groundPlane: { show: true, color: '#0d1117' },
        light: {
          main: { intensity: 1.6, shadow: true, shadowQuality: 'high', alpha: 30, beta: 40 },
          ambient: { intensity: 0.9 },
        },
        // 克制商务风：关闭 geo3D 内建 postEffect bloom 后处理（省 GPU 开销）
        postEffect: { enable: false, bloom: { enable: false } },
        viewControl: {
          projection: 'perspective',
          autoRotate: DataStore.get('mapRotating'),
          autoRotateDirection: 'right',
          autoRotateSpeed: 2,
          distance: calcDistance() * 2.4,   // 视距放大：环形柱 + 地图整体可见
          minDistance: 32, maxDistance: 320,
          alpha: MAP_VIEW.alpha,
          beta: MAP_VIEW.beta,
          center: _lastCenter || MAP_VIEW.center,
          animationDurationUpdate: 1000,
          animationEasingUpdate: 'cubicOut',
          damping: 0.85,
          rotateSensitivity: 1.0,
          zoomSensitivity: 1.0,
          panSensitivity: 0,
        },
        label: {
          show: true, color: '#94a3b8', fontSize: 10,
          textStyle: { textShadowColor: 'rgba(0,0,0,0.8)', textShadowBlur: 4 },
        },
        itemStyle: { borderColor: 'rgba(34,211,238,0.2)', borderWidth: 0.5 },
        emphasis: {
          label: { color: '#fff', fontSize: 14, fontWeight: 'bold' },
          itemStyle: { borderColor: '#22d3ee', borderWidth: 2 },
        },
      },
      series,
    }, { lazyUpdate: true }); // lazyUpdate：合并 setOption 渲染批次，降低每帧重绘开销

    bindBarEvents();
    // 生长动效：柱体从贴地(z=1)按产量从低到高逐批升起 + 柱顶光球同步点亮
    growBars(barData);
  };

  // ── bar3D 事件：点击 → 聚焦 + 详情抽屉；hover 用内建 emphasis（不再全量重建 31 柱透明度）──
  const bindBarEvents = () => {
    if (_barEventsBound || !chart) return;
    _barEventsBound = true;
    // ── 点击修复（核心痛点）：可靠触发「高亮 + 地图聚焦 + 详情面板」──
    // 根因：echarts-gl 2.0.9 的 LayerGL._dispatchDataEvent 仅当 mesh.dataIndex >= 0
    // （dataIndex 只在 mousemove 时赋值，Bar3DView/PointsBuilder 的 mouseout 又置 -1）
    // 才向 echarts 派发 click；未悬停直接点击、或点击无 dataIndex 的装饰 scatter 时
    // click 在 GL 层被静默丢弃。修复双通道：
    //   a) chart.on('click') 主通道 —— bar3D/标签数据项均携带 _barIdx 反查省份；
    //   b) chart.getZr().on('click') 低层兜底 —— 点击坐标 → 世界/屏幕投影 → 最近柱判定，
    //      覆盖「未悬停直接点击」等 GL 门控丢弃场景。
    // 双通道用 _glClickHandled 标志 + 名称/时间锁去重（避免抽屉重复打开）。
    // 兜底通道：GL 层 click 数据事件需要 mesh.dataIndex（mousemove 时由内部 picking 赋值），
    // 未悬停直接点击会丢失 → 改用「hover 记录」兜底：mouseover 时记录最近命中的柱，
    // click 时主通道未触发则用该记录（零几何投影，与 echarts-gl 内部 picking 完全一致）。
    let _barClickLock = null, _glClickHandled = false;
    let _hoverBarRec = null; // 最近 hover 的柱 { name, dataIndex }
    const openBarProvince = (name, idx) => {
      if (!name) return;
      const now = Date.now();
      if (_barClickLock && _barClickLock.name === name && now - _barClickLock.t < 600) return;
      _barClickLock = { name, t: now };
      focusProvince(name);
      DrawerModule.open(name);
    };
    const pickBarByScreen = (x, y) => {
      // 历史实现（手写 PV 投影）对 echarts-gl z-up 世界坐标假设错误，坐标超界不可用；
      // 现改用 hover 记录：鼠标必然先移动到柱体（mousemove → picking → dataIndex），
      // 记录即最近命中的柱，点击时直接使用。无 hover 记录时尝试按命中点采样。
      if (_hoverBarRec && _hoverBarRec.dataIndex != null) return _hoverBarRec.dataIndex;
      try {
        const m = chart.getModel().getComponent('geo3D');
        const cs = (Array.isArray(m) ? m[0] : m) && (Array.isArray(m) ? m[0] : m).coordinateSystem;
        const layer = cs && cs.viewGL && cs.viewGL.layer;
        if (layer && typeof layer.pickObject === 'function') {
          const obj = layer.pickObject(x, y);
          if (obj && obj.target && obj.target.eventData && obj.target.eventData.dataIndex != null) {
            return obj.target.eventData.dataIndex;
          }
        }
      } catch (e) { /* fallthrough */ }
      return -1;
    };
    chart.on('click', (p) => {
      if (!p) return;
      if (p.seriesId === 'province-bars') {
        _glClickHandled = true;
        openBarProvince(p.name, p.dataIndex);
        return;
      }
      const byId = p.seriesId === 'bar-labels' ? _lastLabelData : null;
      const it = byId && p.dataIndex != null ? byId[p.dataIndex] : null;
      if (it) { _glClickHandled = true; openBarProvince(it.name, it._barIdx); }
    });
    if (chart.getZr) {
      chart.getZr().on('click', (e) => {
        if (_glClickHandled) { _glClickHandled = false; return; }
        if (!e || e.offsetX == null) return;
        const idx = pickBarByScreen(e.offsetX, e.offsetY);
        if (idx >= 0 && _lastBarData[idx]) openBarProvince(_lastBarData[idx].name, idx);
      });
    }
    // hover 记录：mouseover/mouseout/globalout 维护最近命中柱
    chart.on('mouseover', (p) => {
      if (!p) return;
      if (p.seriesId === 'province-bars' && p.dataIndex != null) {
        _hoverBarRec = { name: p.name, dataIndex: p.dataIndex };
      }
    });
    // ── 柱顶标签 LOD：相机距离超过阈值 → 隐藏标签（近显远隐，500ms 轮询，仅阈值翻转才 setOption）──
    const LABEL_HIDE_DIST = calcDistance() * 2.4 * 1.55;
    let _labelShown = true;
    const updateLabelLod = () => {
      if (!chart) return;
      let dist = Infinity;
      try {
        const m = chart.getModel().getComponent('geo3D');
        const cs = (Array.isArray(m) ? m[0] : m) && (Array.isArray(m) ? m[0] : m).coordinateSystem;
        const cam = cs && cs.viewGL && cs.viewGL.camera;
        if (cam && cam.position) {
          const p = cam.position;
          dist = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z);
        }
      } catch (e) {}
      const show = dist <= LABEL_HIDE_DIST;
      if (show !== _labelShown) {
        _labelShown = show;
        chart.setOption({ series: [{ id: 'bar-labels', label: { show } }] });
      }
    };
    clearInterval(_lodTimer);
    _lodTimer = setInterval(updateLabelLod, 500);
    updateLabelLod();
  };

  // ── 柱体生长动画：初始 z=1（贴地），按产量从低到高分批升起（每批 220ms）──
  // 柱身/标签随柱高同步上升；纯 setOption 数据驱动（一次性动画，结束即停）
  const growBars = (fullData) => {
    if (!chart || !_lastBarData) return;
    clearInterval(_growTimer);
    const order = fullData.map((d, i) => ({ i, v: d.production != null ? d.production : d.value[2] }))
      .sort((a, b) => a.v - b.v);
    const zs = fullData.map(() => 1);
    const batch = Math.max(4, Math.ceil(order.length / 7));
    let cursor = 0;
    const apply = () => {
      if (!chart) return;
      const bars = _lastBarData.map((d, i) => Object.assign({}, d, { value: [d.value[0], d.value[1], zs[i]] }));
      const labels = _lastLabelData.map((d) => Object.assign({}, d, {
        value: [d.value[0], d.value[1], zs[d._barIdx] + d._dz],
      }));
      chart.setOption({ series: [
        { id: 'province-bars', data: bars },
        { id: 'bar-labels', data: labels },
      ]});
      _lastBarData = bars; _lastLabelData = labels;
    };
    apply();
    _growTimer = setInterval(() => {
      const slice = order.slice(cursor, cursor + batch);
      slice.forEach(o => { zs[o.i] = fullData[o.i].value[2]; });
      cursor += batch;
      apply();
      if (cursor >= order.length) { clearInterval(_growTimer); _growTimer = null; }
    }, 220);
  };

  // ── 实时联动：RealTimeEngine 每 3s 触发，柱高 ±2% 微调（增量 setOption，只更新 data）──
  const applyRealtimePulse = () => {
    if (!chart || !_lastBarData || !_lastBarBaseZ || _growTimer) return;
    const f = 1 + (Math.random() - 0.5) * 0.04; // ±2% 全局因子
    const zAt = (i) => Math.max(1.05, Math.min(8, _lastBarBaseZ[i] * f));
    const bars = _lastBarData.map((d, i) => {
      const z = zAt(i);
      _lastBarZMap[d.name] = z;
      return Object.assign({}, d, { value: [d.value[0], d.value[1], z] });
    });
    const labels = _lastLabelData.map((d) => Object.assign({}, d, {
      value: [d.value[0], d.value[1], zAt(d._barIdx) + d._dz],
    }));
    chart.setOption({ series: [
      { id: 'province-bars', data: bars },
      { id: 'bar-labels', data: labels },
    ]});
    _lastBarData = bars; _lastLabelData = labels;
  };

  // 聚焦某省：viewControl.center 移到该省（world 坐标），带动画过渡
  const focusProvince = (name) => {
    if (!chart) return;
    const c = _coordByName[normalizeName(name)] || PROVINCE_CENTERS[name];
    if (!c) { console.warn('[MapModule] 未找到省份坐标:', name); return; }
    let world = null;
    try {
      const m = chart.getModel().getComponent('geo3D');
      const coordSys = (Array.isArray(m) ? m[0] : m) && (Array.isArray(m) ? m[0] : m).coordinateSystem;
      if (coordSys && coordSys.dataToPoint) world = coordSys.dataToPoint([c[0], c[1], 1]);
    } catch (e) { /* 坐标换算失败时忽略 */ }
    if (!world) world = [c[0], c[1], 0];
    _lastCenter = world;
    chart.setOption({
      geo3D: {
        id: 'geo3d',
        viewControl: {
          center: world,
          distance: 22,
          alpha: MAP_VIEW.alpha,
          beta: MAP_VIEW.beta,
          autoRotate: DataStore.get('mapRotating'),
          animationDurationUpdate: 1000,
          animationEasingUpdate: 'cubicOut',
        },
      },
    });
  };

  const init = async () => { await render(); };
  const resize = () => {
    if (!chart) return;
    chart.setOption({ geo3D: { id: 'geo3d', viewControl: { distance: calcDistance(), center: _lastCenter || MAP_VIEW.center } } });
    chart.resize();
  };
  const locate = () => {
    if (!chart) return;
    _lastCenter = null;
    chart.setOption({
      geo3D: {
        id: 'geo3d',
        viewControl: {
          center: MAP_VIEW.center, alpha: MAP_VIEW.alpha, beta: MAP_VIEW.beta,
          distance: calcDistance(), autoRotate: DataStore.get('mapRotating'),
          animationDurationUpdate: 800, animationEasingUpdate: 'cubicOut',
        }
      }
    });
  };
  const toggleRotate = () => {
    const r = !DataStore.get('mapRotating');
    DataStore.set('mapRotating', r);
    if (chart) chart.setOption({ geo3D: { id: 'geo3d', viewControl: { autoRotate: r } } });
    return r;
  };
  const toggleFlyline = () => {
    _flylineEnabled = !_flylineEnabled;
    render();
    return _flylineEnabled;
  };

  // ── 调试/验证钩子：官方 picking 扫描柱体屏幕坐标 ──
  // 复用 echarts-gl LayerGL.pickObject（CPU 射线求交，与内部 hover/click 同一套机制），
  // 通过命中三角形 getDataIndexOfVertex 反查柱数据索引 → 精确屏幕坐标，零手写投影误差。
  const getScreenBarPositions = () => {
    if (!chart || !_lastBarData || !_lastBarData.length) return [];
    const out = [];
    try {
      const m = chart.getModel().getComponent('geo3D');
      const cs = (Array.isArray(m) ? m[0] : m) && (Array.isArray(m) ? m[0] : m).coordinateSystem;
      const layer = cs && cs.viewGL && cs.viewGL.layer;
      const canvas = layer && layer.renderer && layer.renderer.canvas;
      const dom = canvas || (cs && cs.viewGL && cs.viewGL.domElement);
      if (!layer || typeof layer.pickObject !== 'function' || !dom) return out;
      const w = dom.clientWidth || dom.width || 0;
      const h = dom.clientHeight || dom.height || 0;
      if (!w || !h) return out;
      // canvas 相对页面的偏移（点击用页面坐标）
      let offX = 0, offY = 0;
      try {
        const r = dom.getBoundingClientRect();
        offX = r.left; offY = r.top;
      } catch (e) { /* ignore */ }
      // 找到 province-bars 的 seriesIndex（barMesh.seriesIndex 与之比对）
      let barSeriesIdx = -1;
      try {
        const opt = chart.getOption();
        barSeriesIdx = (opt.series || []).findIndex(s => s.id === 'province-bars');
      } catch (e) { /* ignore */ }
      const hits = new Map(); // dataIndex -> { x, y }
      for (let y = 6; y < h; y += 24) {
        for (let x = 6; x < w; x += 24) {
          let obj = null;
          try { obj = layer.pickObject(x, y); } catch (e) { continue; }
          if (!obj || !obj.target || !obj.target.geometry) continue;
          const t = obj.target;
          // 仅接受 bar3D 的统一柱 mesh（具有 getDataIndexOfVertex 的几何）
          if (typeof t.geometry.getDataIndexOfVertex !== 'function') continue;
          if (barSeriesIdx >= 0 && t.seriesIndex !== undefined && t.seriesIndex !== barSeriesIdx) continue;
          const tri = obj.triangle || [];
          const di = tri.length ? t.geometry.getDataIndexOfVertex(tri[0]) : -1;
          if (di >= 0 && di < _lastBarData.length && !hits.has(di)) {
            hits.set(di, { x, y });
          }
        }
      }
      _lastBarData.forEach((d, i) => {
        const p = hits.get(i);
        if (p) out.push({
          name: d.name, index: i,
          x: Math.round(p.x + offX), y: Math.round(p.y + offY),
          production: d.production != null ? d.production : null,
        });
      });
    } catch (e) { /* 扫描失败返回已收集项 */ }
    return out;
  };

  return { init, resize, locate, toggleRotate, toggleFlyline, render, focusProvince, applyRealtimePulse, getScreenBarPositions, rawChart: () => chart };
})();
