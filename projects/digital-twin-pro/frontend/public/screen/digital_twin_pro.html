// ── KPIModule 增强版 ──
const KPIModule = (() => {
  const METRICS = [
    { key: 'total_production', label: '总产量', unit: '吨', yoyKey: 'production_change_pct' },
    { key: 'total_area', label: '总面积', unit: '亩', yoyKey: 'area_change_pct' },
    { key: 'food_production_pct', label: '粮食占比', unit: '%', yoyKey: 'food_production_change_pct', isPct: true },
    { key: 'economic_production_pct', label: '经济作物占比', unit: '%', yoyKey: 'economic_production_change_pct', isPct: true },
  ];

  const renderSparkline = (key, values) => {
    if (!values || values.length < 2) return '';
    const w = 80, h = 16;
    const max = Math.max(...values), min = Math.min(...values);
    const range = max - min || 1;
    const points = values.map((v, i) => `${i * (w / (values.length - 1))},${h - ((v - min) / range) * h}`).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" class="kpi-sparkline">
      <polyline points="${points}" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
      <polygon points="${points} ${w},${h} 0,${h}" fill="url(#grad-${key})" opacity="0.15"/>
      <defs><linearGradient id="grad-${key}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="transparent"/>
      </linearGradient></defs>
    </svg>`;
  };

  const render = () => {
    const kpi = DataStore.getKPI();
    const yoy = DataStore.getYoY();
    if (!kpi) return;
    const grid = document.getElementById('kpi-grid');
    grid.innerHTML = METRICS.map(m => {
      const val = kpi[m.key] || 0;
      const yoyVal = yoy[m.yoyKey];
      const yoyClass = yoyVal != null ? (yoyVal >= 0 ? 'up' : 'down') : '';
      const yoyArrow = yoyVal != null ? (yoyVal >= 0 ? '&#x25B2;' : '&#x25BC;') : '';
      const yoyText = yoyVal != null ? Math.abs(yoyVal).toFixed(1) + '%' : '--';
      const hist = DataStore.getHistory(m.key);
      const sparkline = m.isPct ? '' : renderSparkline(m.key, hist);
      return `
        <div class="kpi-card" data-kpi="${m.key}">
          <div class="kpi-label">${m.label}</div>
          <div class="kpi-value" id="kpi-val-${m.key}">--</div>
          <div class="kpi-yoy ${yoyClass}">${yoyArrow} ${yoyText}</div>
          ${sparkline}
        </div>
      `;
    }).join('');

    METRICS.forEach(m => {
      const el = document.getElementById('kpi-val-' + m.key);
      const val = kpi[m.key] || 0;
      if (m.isPct) animateNumber(el, val, '%');
      else animateNumber(el, val);
    });
  };

  // 实时更新：只更新数字文本（3s tick 一次，直接赋值比 rAF 动画更省 CPU；无 pulse 动画/强制 reflow）
  const updateRealtime = (kpi) => {
    METRICS.forEach(m => {
      const el = document.getElementById('kpi-val-' + m.key);
      if (!el) return;
      const val = kpi[m.key] || 0;
      el.textContent = m.isPct ? fmtNum(val) + '%' : fmtNum(val);
    });
  };

  return { render, updateRealtime };
})();

// ── StructureModule 增强版 ──
const StructureModule = (() => {
  // 克制商务风：结构环颜色固定为青色单色系（不再沿用后端数据里的 amber/green/purple 花色）
  const CAT_COLORS = { '粮食作物': '#22d3ee', '经济作物': '#06b6d4', '其他作物': '#64748b' };

  const render = () => {
    const cats = DataStore.getCategories();
    if (!cats || cats.length === 0) return;
    const metric = DataStore.get('metric');
    const total = cats.reduce((s, c) => s + (metric === 'production' ? c.production : c.area), 0);
    if (total === 0) return;

    const size = 100, cx = 50, cy = 50, r = 38, ir = 24;
    let startAngle = -Math.PI / 2;
    const segments = cats.map(c => {
      const val = metric === 'production' ? c.production : c.area;
      const pct = val / total;
      const angle = pct * Math.PI * 2;
      const endAngle = startAngle + angle;
      const x1 = cx + r * Math.cos(startAngle);
      const y1 = cy + r * Math.sin(startAngle);
      const x2 = cx + r * Math.cos(endAngle);
      const y2 = cy + r * Math.sin(endAngle);
      const large = angle > Math.PI ? 1 : 0;
      const d = `M ${cx + ir * Math.cos(startAngle)} ${cy + ir * Math.sin(startAngle)} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${cx + ir * Math.cos(endAngle)} ${cy + ir * Math.sin(endAngle)} A ${ir} ${ir} 0 ${large} 0 ${cx + ir * Math.cos(startAngle)} ${cy + ir * Math.sin(startAngle)} Z`;
      const seg = { d, color: CAT_COLORS[c.name] || '#64748b', name: c.name, pct, val };
      startAngle = endAngle;
      return seg;
    });

    const svg = `<svg width="${size*2}" height="${size*2}" viewBox="0 0 ${size*2} ${size*2}" class="structure-svg">
      ${segments.map(s => `<path d="${s.d}" fill="${s.color}" stroke="#0d1117" stroke-width="1.5" opacity="0.85"/>`).join('')}
      <circle cx="${cx*2}" cy="${cy*2}" r="${ir*2}" fill="none"/>
    </svg>`;

    const legend = segments.map(s => `
      <div class="structure-legend-item">
        <span class="structure-legend-dot" style="background:${s.color}"></span>
        <span class="structure-legend-label">${s.name}</span>
        <span class="structure-legend-val">${(s.pct*100).toFixed(1)}%</span>
      </div>
    `).join('');

    document.getElementById('structure-panel').innerHTML = `<div class="structure-wrap">${svg}<div class="structure-legend">${legend}</div></div>`;
  };
  return { render };
})();

// ── RankingModule：实时 tick 增量更新（只改行内文本/条宽，不重建 innerHTML；事件委托一次绑定）──
const RankingModule = (() => {
  const CAT_COLORS = { '粮食作物': '#22d3ee', '经济作物': '#06b6d4', '其他作物': '#64748b' };
  let _prevSig = null;
  let _delegated = false;

  const rowHtml = (item, i, maxVal) => {
    const pct = (item.value / maxVal * 100).toFixed(0);
    const color = CAT_COLORS[item.category] || '#64748b';
    return `
        <li class="rank-item clickable">
          <span class="rank-num">${i+1}</span>
          <span class="rank-name">${item.name}</span>
          <span class="rank-cat">${item.category||''}</span>
          <div class="rank-bar-wrap">
            <div class="rank-bar" style="width:${pct}%;background:${color}"></div>
          </div>
          <span class="rank-val">${fmtNum(item.value)}</span>
        </li>
      `;
  };

  // 事件委托：整个列表只绑定一次，重建 DOM 也无需重绑（避免每 3s 重绑 15 个监听器）
  const ensureDelegation = () => {
    if (_delegated) return;
    _delegated = true;
    const list = document.getElementById('rank-list');
    list.addEventListener('click', (e) => {
      const item = e.target.closest('.rank-item');
      if (!item) return;
      list.querySelectorAll('.rank-item.active').forEach(x => x.classList.remove('active'));
      item.classList.add('active');
      const cropName = item.querySelector('.rank-name') ? item.querySelector('.rank-name').textContent.trim() : '';
      const provs = (DataStore.getProvinceData() || [])
        .filter(p => p.production > 0 && (p.top_crop || p.mainCrop || '') === cropName);
      if (!provs.length) return; // 聚合类作物（如“粮食”）无对应省份时仅高亮
      const best = provs.sort((a, b) => b.production - a.production)[0];
      MapModule.focusProvince(best.province);
      DrawerModule.open(best.province);
    });
  };

  const render = () => {
    const data = DataStore.getRankings();
    const list = document.getElementById('rank-list');
    if (!data || data.length === 0) {
      _prevSig = null;
      list.innerHTML = '<li style="color:var(--text-muted);padding:16px;text-align:center">暂无数据</li>';
      return;
    }
    const sorted = [...data].sort((a, b) => b.value - a.value).slice(0, 15);
    const maxVal = sorted[0]?.value || 1;
    // 签名 = 年份+指标+排名顺序：实时 tick 只改数值不换顺序 → 走增量；切换/首渲 → 全量重建
    const sig = DataStore.get('year') + ':' + DataStore.get('metric') + ':' + sorted.map(d => d.name).join(',');

    if (sig !== _prevSig) {
      _prevSig = sig;
      list.innerHTML = sorted.map((item, i) => rowHtml(item, i, maxVal)).join('');
    } else {
      // 实时 tick：仅更新行内文本与条宽（无 flash 动画、无 DOM 重建）
      const items = list.querySelectorAll('.rank-item');
      sorted.forEach((item, i) => {
        const li = items[i];
        if (!li) return;
        const pct = (item.value / maxVal * 100).toFixed(0);
        const color = CAT_COLORS[item.category] || '#64748b';
        li.querySelector('.rank-num').textContent = (i + 1);
        li.querySelector('.rank-val').textContent = fmtNum(item.value);
        const bar = li.querySelector('.rank-bar');
        bar.style.width = pct + '%';
        bar.style.background = color;
      });
    }
    ensureDelegation();
  };

  return { render };
})();

// ── DrawerModule: 省份详情抽屉（点击柱体 / 左侧栏 → 聚焦 + 详情） ──
// 数据来源：优先后端 /api/analytics/province/{name}?year=，失败回退本地 dashboard 聚合
const DrawerModule = (() => {
  let _state = null; // { name, year, detail, source }

  const drawerEl = () => document.getElementById('province-drawer');
  const bodyEl = () => document.getElementById('drawer-body');
  const footerEl = () => document.getElementById('drawer-footer');

  const isOpen = () => !!drawerEl() && drawerEl().classList.contains('open');

  // 归一化后端/本地两种返回结构（契约字段与后端实际字段做防御性兼容）
  const normalizeDetail = (d, name, year, source) => {
    const crops = (Array.isArray(d.crops) ? d.crops : [])
      .map(c => ({
        name: c.name || c.crop || '未知',
        category: c.category || '',
        production: c.production != null ? c.production : 0,
        area: c.area != null ? c.area : 0,
        pct: c.pct_of_total != null ? c.pct_of_total : (c.production_pct != null ? c.production_pct : null),
      }))
      .filter(c => c.production > 0 || c.area > 0)
      .sort((a, b) => b.production - a.production);
    const mainCrop = d.main_crop || d.mainCrop || d.top_crop || (d.topCrop != null ? (d.topCrop.crop || d.topCrop.name || d.topCrop) : null) || (crops[0] ? crops[0].name : null);
    return {
      province: d.province || name,
      year: d.year != null ? d.year : year,
      total_production: d.total_production != null ? d.total_production : crops.reduce((s, c) => s + c.production, 0),
      total_area: d.total_area != null ? d.total_area : crops.reduce((s, c) => s + c.area, 0),
      main_crop: typeof mainCrop === 'string' ? mainCrop : (mainCrop ? (mainCrop.crop || mainCrop.name || '') : null),
      crops,
      source,
    };
  };

  // 后端 API 优先（4s 超时）
  const fetchProvinceDetail = async (name, year) => {
    const url = `${APP_CONFIG.apiBase}/api/analytics/province/${encodeURIComponent(name)}?year=${year}`;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    try {
      const resp = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const d = await resp.json();
      console.log('[Drawer] API 成功:', url);
      return normalizeDetail(d, name, year, 'api');
    } finally {
      clearTimeout(timer);
    }
  };

  // 本地兜底：从 dashboard 数据聚合（仅有省份总量，无分省作物明细）
  const getProvinceDetailLocal = (name, year) => {
    const raw = DataStore.get('rawData');
    const list = (raw && raw.province) || [];
    const p = list.find(x => (x.province === name || x.provinceFull === name) && x.year === year);
    if (!p) throw new Error('本地无 ' + name + ' ' + year + ' 数据');
    return normalizeDetail({
      province: p.province,
      year,
      total_production: p.production,
      total_area: p.area,
      main_crop: p.mainCrop || p.top_crop || null,
      crops: [],
    }, name, year, 'local');
  };

  // ── 渲染 ──
  const KPI_CARD = (key, label, val, unit, wide) => `
    <div class="kpi-card ${wide ? 'drawer-kpi-wide' : ''}">
      <div class="kpi-label">${label}</div>
      <div class="kpi-value" id="drawer-kpi-${key}" style="font-size:${wide ? 14 : 15}px">${val}</div>
      <div class="kpi-unit" style="font-size:10px;color:var(--text-muted)">${unit}</div>
    </div>`;

  const donutSvg = (items) => {
    const size = 90, cx = 45, cy = 45, r = 36, ir = 22;
    let start = -Math.PI / 2;
    const total = items.reduce((s, it) => s + it.production, 0) || 1;
    const segs = items.map((it, i) => {
      const angle = (it.production / total) * Math.PI * 2;
      const end = start + angle;
      const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
      const x2 = cx + r * Math.cos(end), y2 = cy + r * Math.sin(end);
      const large = angle > Math.PI ? 1 : 0;
      const d = `M ${cx + ir * Math.cos(start)} ${cy + ir * Math.sin(start)} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${cx + ir * Math.cos(end)} ${cy + ir * Math.sin(end)} A ${ir} ${ir} 0 ${large} 0 ${cx + ir * Math.cos(start)} ${cy + ir * Math.sin(start)} Z`;
      start = end;
      return `<path d="${d}" fill="${it.color}" stroke="#0d1117" stroke-width="1.2" opacity="0.9"/>`;
    }).join('');
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0">${segs}</svg>`;
  };

  const CAT_COLORS = { '粮食作物': '#22d3ee', '经济作物': '#06b6d4', '其他作物': '#64748b' };
  const PALETTE = ['#22d3ee', '#06b6d4', '#0891b2', '#67e8f9', '#64748b'];

  const renderDetail = (d) => {
    document.getElementById('drawer-province').textContent = d.province;
    document.getElementById('drawer-year').textContent = d.year + ' 年';

    const fmtW = (n) => fmtNumRaw(n / 1e4); // 万吨 / 万亩
    const kpis = KPI_CARD('prod', '总产量', fmtW(d.total_production), '万吨', true)
      + KPI_CARD('area', '总面积', fmtW(d.total_area), '万亩', true)
      + KPI_CARD('main', '主产作物', d.main_crop || '--', '', true);

    let cropsHtml;
    if (!d.crops.length) {
      cropsHtml = `<div class="drawer-empty">${d.source === 'local'
        ? '本地数据无分省作物明细，启动后端 API 后可查看完整明细'
        : '暂无作物明细数据'}</div>`;
    } else {
      const rows = d.crops.slice(0, 15).map(c => `
        <tr>
          <td>${c.name}<span class="crop-cat">${c.category || '--'}</span></td>
          <td class="num">${fmtNumRaw(c.production)}</td>
          <td class="num">${c.pct != null ? c.pct.toFixed(1) + '%' : (d.total_production ? (c.production / d.total_production * 100).toFixed(1) + '%' : '--')}</td>
        </tr>`).join('');
      cropsHtml = `<table class="crop-table">
        <thead><tr><th>作物</th><th>产量(吨)</th><th>占比</th></tr></thead>
        <tbody>${rows}</tbody></table>`;
    }

    const top5 = d.crops.slice(0, 5).map((c, i) => Object.assign({}, c, {
      color: CAT_COLORS[c.category] || PALETTE[i % PALETTE.length],
    }));
    const donutHtml = top5.length
      ? `<div class="drawer-donut">${donutSvg(top5)}
          <div class="drawer-donut-legend">${top5.map(it => `
            <div class="donut-item"><span class="donut-dot" style="background:${it.color}"></span><span>${it.name}</span><span class="v">${it.pct != null ? it.pct.toFixed(1) : (d.total_production ? (it.production / d.total_production * 100).toFixed(1) : '--')}%</span></div>`).join('')}
          </div></div>`
      : '';

    bodyEl().innerHTML = `
      <div class="drawer-kpi">${kpis}</div>
      <div class="drawer-subtitle">作物明细 TOP${Math.min(d.crops.length || 15, 15)}</div>
      ${cropsHtml}
      ${top5.length ? `<div class="drawer-subtitle">产量占比 TOP5</div>${donutHtml}` : ''}`;

    footerEl().innerHTML = `
      <span>数据来源</span>
      <span class="drawer-src ${d.source}">${d.source === 'api' ? 'API · 实时' : 'LOCAL · 静态'}</span>`;
  };

  const renderLoading = () => {
    bodyEl().innerHTML = '<div class="drawer-loading">加载中…</div>';
    footerEl().innerHTML = '';
  };

  const renderError = (msg, name, year) => {
    bodyEl().innerHTML = `
      <div class="drawer-error">
        <div>⚠ ${msg}</div>
        <button id="drawer-retry">重试</button>
      </div>`;
    footerEl().innerHTML = '';
    const btn = document.getElementById('drawer-retry');
    if (btn) btn.addEventListener('click', () => { renderLoading(); load(name, year); });
  };

  // 主流程：API 优先 → 本地回退 → 失败重试
  const load = async (name, year) => {
    renderLoading();
    let detail = null;
    try {
      detail = await fetchProvinceDetail(name, year);
    } catch (err) {
      console.warn('[Drawer] API 失败，回退本地:', err.message || err);
      try {
        detail = getProvinceDetailLocal(name, year);
      } catch (err2) {
        renderError((err2 && err2.message) || '数据加载失败', name, year);
        return;
      }
    }
    _state = { name, year, detail };
    renderDetail(detail);
  };

  const open = (name) => {
    const year = DataStore.get('year');
    document.getElementById('drawer-province').textContent = name;
    document.getElementById('drawer-year').textContent = year + ' 年';
    drawerEl().classList.add('open');
    _state = { name, year, detail: null };
    load(name, year);
  };

  const close = () => {
    drawerEl().classList.remove('open');
  };

  // 实时更新：抽屉打开时仅刷新抽屉内数字（±2% 波动），不重开抽屉
  const updateRealtime = () => {
    if (!isOpen() || !_state || !_state.detail) return;
    const d = _state.detail;
    const delta = (Math.random() - 0.5) * 0.04;
    d.total_production = Math.max(0, d.total_production * (1 + delta));
    d.total_area = Math.max(0, d.total_area * (1 + delta));
    const p = document.getElementById('drawer-kpi-prod');
    const a = document.getElementById('drawer-kpi-area');
    if (p) p.textContent = fmtNumRaw(d.total_production / 1e4);
    if (a) a.textContent = fmtNumRaw(d.total_area / 1e4);
  };

  return { open, close, isOpen, updateRealtime, getProvinceDetailLocal };
})();

// ── ThreeForest Pro: 生态绿能源塔（省份产量柱状森林）──
// 31 省产量圆柱 + 顶部发光球冠；生长/呼吸脉冲/hover tooltip/点击联动地图抽屉
const ThreeForest = (() => {
  let scene, camera, renderer, controls;
  let container, rafId = null, loopRunning = false;
  let initialized = false;
  let THREE_ = null;
  let bars = [];            // { group, cyl, cap, data, bh, phase, index, growStart, baseEmissive }
  let hitObjects = [];      // raycast 命中对象（柱身 + 球冠）
  let tooltipEl = null;
  let hovered = null;
  let raycaster = null;
  let _dataSig = null;

  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const easeOutBack = (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  };
  const hexToRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const lerpColorHex = (a, b, t) => {
    const A = hexToRgb(a), B = hexToRgb(b);
    return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`;
  };
  const fmtT = (n) => (n != null && !isNaN(n)) ? Math.round(n).toLocaleString('zh-CN') : '--';
  const fmtMu = (n) => (n != null && !isNaN(n)) ? Math.round(n).toLocaleString('zh-CN') : '--';

  // 省份产量数据（与地图同源，按产量降序）
  const getProvinceBars = () =>
    (DataStore.getProvinceData() || [])
      .filter(p => p.production != null && p.production > 0)
      .sort((a, b) => b.production - a.production);

  // 重建森林：清除旧柱 → 按 8 列网格生成圆柱 + 发光球冠
  const buildForest = () => {
    bars.forEach(b => {
      scene.remove(b.group);
      b.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    });
    bars = []; hitObjects = [];

    const data = getProvinceBars();
    if (!data.length) return;
    const maxVal = data[0].production || 1;
    const cols = 8, spacing = 2.5;
    const rows = Math.ceil(data.length / cols);
    const offsetX = (cols - 1) * spacing / 2;
    const offsetZ = (rows - 1) * spacing / 2;
    // 柱体青色单色系：Top1 亮青 → 其余按产量在 深青→亮青 区间渐变（克制商务风）
    const DEEP = '#0891b2', BRIGHT = '#22d3ee', GOLD = '#67e8f9'; // 深青 → 主青 → 亮青（Top1）
    const CAP_A = '#22d3ee', CAP_B = '#67e8f9';                   // 球冠：主青 → 亮青
    // 深青→亮青 两段插值：其余柱按产量 t∈[0,1] 在 [DEEP, BRIGHT] 区间插值（低产深青 → 中高产亮青）
    const lerp2 = (t) => lerpColorHex(DEEP, BRIGHT, t);

    data.forEach((p, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const t = maxVal > 0 ? Math.sqrt(Math.max(p.production, 0) / maxVal) : 0;
      const bh = Math.max(0.5, 1 + t * 7); // 1-8，与地图柱高同尺度
      const isTop1 = i === 0;
      const group = new THREE_.Group();

      // 柱身：圆角柱体（多段 CylinderGeometry 堆叠近似圆角：下宽上窄逐段收拢 + 顶部半球收口）
      // 颜色规格：Top1 亮青，其余按产量在 深青→亮青 区间渐变（青色单色系）
      const rTop = 0.74, rBottom = 0.92;
      const cylColor = new THREE_.Color(isTop1 ? GOLD : lerp2(t));
      const cylMat = new THREE_.MeshStandardMaterial({
        color: cylColor, roughness: 0.35, metalness: 0.1,
        emissive: cylColor, emissiveIntensity: 0.12,
        transparent: true, opacity: 0.94,
      });
      const cyl = new THREE_.Group();          // 圆角柱体容器（多段堆叠，组原点=柱底）
      const cylMeshes = [];
      const segCount = 4, segH = bh / segCount;
      for (let s = 0; s < segCount; s++) {
        const f0 = s / segCount, f1 = (s + 1) / segCount;
        // 圆角轮廓：底段近全半径，顶部段快速收窄（二次曲线模拟圆角收口）
        const r0 = rBottom - (rBottom - rTop) * f0 * f0;
        const r1 = rBottom - (rBottom - rTop) * f1 * f1;
        const seg = new THREE_.Mesh(new THREE_.CylinderGeometry(r1, r0, segH + 0.02, 12, 1), cylMat);
        seg.position.y = segH * (s + 0.5);
        seg.castShadow = true;
        seg.receiveShadow = true;
        cyl.add(seg);
        cylMeshes.push(seg);
      }
      // 顶部圆角半球收口（视觉圆润）
      const dome = new THREE_.Mesh(new THREE_.SphereGeometry(rTop, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), cylMat);
      dome.position.y = bh - rTop * 0.55;
      dome.castShadow = true;
      cyl.add(dome);
      cylMeshes.push(dome);
      group.add(cyl);

      // 球冠：MeshBasicMaterial 自发光，Top1 亮青其余同色系（无 Bloom 也能看清）
      const capGeo = new THREE_.SphereGeometry(0.52, 12, 8);
      const capMat = new THREE_.MeshBasicMaterial({
        color: new THREE_.Color(isTop1 ? CAP_B : CAP_A),
        transparent: true, opacity: 0.98,
      });
      const cap = new THREE_.Mesh(capGeo, capMat);
      cap.position.y = bh + 0.16;
      group.add(cap);

      // 半透明圆形底座：CircleGeometry 贴地浅光圈（青色系，静态）
      const baseGeo = new THREE_.CircleGeometry(1.5, 24);
      const baseMat = new THREE_.MeshBasicMaterial({
        color: 0x0891b2, transparent: true, opacity: 0.14,
        side: THREE_.DoubleSide, depthWrite: false,
      });
      const base = new THREE_.Mesh(baseGeo, baseMat);
      base.rotation.x = -Math.PI / 2;
      base.position.y = 0.03;
      group.add(base);

      group.position.set(col * spacing - offsetX, 0, row * spacing - offsetZ);
      const rec = {
        group, cyl, cylMat, cap, base, bh,
        data: { province: p.province, provinceFull: p.provinceFull, production: p.production, area: p.area },
        phase: Math.random() * Math.PI * 2,
        index: i, growStart: null, baseEmissive: 0.12,
      };
      cylMeshes.forEach(m => { m.userData.barRec = rec; });
      cap.userData.barRec = rec;
      base.userData.barRec = rec;
      scene.add(group);
      bars.push(rec);
      hitObjects.push(...cylMeshes, cap, base);
    });

    // 相机 45° 俯视，适配 8 列网格跨度
    const spanX = cols * spacing;
    camera.position.set(spanX * 0.62, spanX * 0.55, spanX * 0.62);
    controls.target.set(0, 2, 0);
    controls.update();
  };

  const init = async () => {
    if (initialized) return;
    container = document.getElementById('three-container');
    const w = container.clientWidth || window.innerWidth * 0.92;
    const h = container.clientHeight || window.innerHeight * 0.92;

    // 动态导入 Three.js：import map 将 'three' 映射到本地 vendor；examples/jsm 内部裸导入由 import map 解析
    const THREE = await import('three');
    THREE_ = THREE;
    const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
    // 克制商务风：不再导入/使用 EffectComposer/RenderPass/UnrealBloomPass（无 Bloom 后处理）

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);
    scene.fog = new THREE.FogExp2(0x0d1117, 0.02); // 弱雾保留，降低远处几何视觉噪声

    camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
    camera.position.set(18, 16, 18);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(1); // 性能优先：固定 1x（原 min(dpr,2)），森林无高 DPI 细节需求
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.BasicShadowMap; // 硬阴影省 GPU（相对 PCFSoft）
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.5;
    controls.target.set(0, 2, 0);
    controls.maxPolarAngle = Math.PI / 2.2;

    // 灯光（蓝青基调，冷色主光 + 青碧补光）
    const ambient = new THREE.AmbientLight(0x334466, 0.6);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(10, 30, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);
    const fillLight = new THREE.DirectionalLight(0x22d3ee, 0.35);
    fillLight.position.set(-10, 10, -10);
    scene.add(fillLight);

    // 地面（深灰蓝玻璃质感，配合底座浅光圈）
    const groundGeo = new THREE.PlaneGeometry(44, 44);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x111827, roughness: 0.5, metalness: 0.2,
      transparent: true, opacity: 0.92,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.1;
    ground.receiveShadow = true;
    scene.add(ground);

    // 网格（青色系）
    const gridHelper = new THREE.GridHelper(44, 22, 0x22d3ee, 0x0e7490);
    gridHelper.position.y = 0;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.2;
    scene.add(gridHelper);

    // hover tooltip（跟随鼠标）
    tooltipEl = document.createElement('div');
    tooltipEl.style.cssText = 'position:fixed;z-index:1100;pointer-events:none;display:none;background:rgba(17,24,39,0.94);border:1px solid rgba(34,211,238,0.35);border-radius:8px;padding:9px 13px;font-size:12px;color:#e8edf5;backdrop-filter:blur(10px);box-shadow:0 4px 24px rgba(0,0,0,0.45);font-variant-numeric:tabular-nums;white-space:nowrap';
    document.body.appendChild(tooltipEl);

    // raycaster 交互：hover tooltip + 点击联动（拖动旋转不触发点击）
    raycaster = new THREE.Raycaster();
    let _downX = 0, _downY = 0, _downT = 0;
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerdown', (e) => { _downX = e.clientX; _downY = e.clientY; _downT = Date.now(); });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (Date.now() - _downT > 600) return;
      const dx = e.clientX - _downX, dy = e.clientY - _downY;
      if (dx * dx + dy * dy > 36) return; // 拖动忽略
      const rec = pickRec(e);
      if (!rec) return;
      // 点击省份柱：先关弹窗，再聚焦地图 + 打开详情抽屉（延迟 200ms 等关闭动画）
      close();
      setTimeout(() => {
        MapModule.focusProvince(rec.data.province);
        DrawerModule.open(rec.data.province);
      }, 200);
    });

    initialized = true;
    _dataSig = null;
  };

  const onPointerMove = (e) => {
    if (!raycaster || !renderer) return;
    const rec = pickRec(e);
    if (rec !== hovered) {
      if (hovered) hovered.hoverBoost = false;
      hovered = rec;
      if (rec) {
        rec.hoverBoost = true;
        tooltipEl.style.display = 'block';
        tooltipEl.innerHTML = `
          <div style="font-size:13px;font-weight:600;color:#22d3ee;margin-bottom:4px">${rec.data.provinceFull || rec.data.province}</div>
          <div style="display:flex;justify-content:space-between;gap:18px"><span style="color:#94a3b8">产量</span><span>${fmtT(rec.data.production)} 吨</span></div>
          <div style="display:flex;justify-content:space-between;gap:18px"><span style="color:#94a3b8">面积</span><span>${fmtMu(rec.data.area)} 亩</span></div>`;
      } else {
        tooltipEl.style.display = 'none';
      }
    }
    if (rec && tooltipEl) {
      tooltipEl.style.left = (e.clientX + 16) + 'px';
      tooltipEl.style.top = (e.clientY + 16) + 'px';
    }
  };

  const pickRec = (e) => {
    const rect = renderer.domElement.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    const ny = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera({ x: nx, y: ny }, camera);
    const hits = raycaster.intersectObjects(hitObjects, false);
    return hits.length ? hits[0].object.userData.barRec || null : null;
  };

  const animate = () => {
    rafId = requestAnimationFrame(animate);

    // 生长动画（错峰 index×35ms，easeOutBack 带过冲，一次性）+ hover 增强；无呼吸脉动/皇冠/粒子
    const now = performance.now();
    bars.forEach(b => {
      if (b.growStart == null) b.growStart = now + b.index * 35;
      const t = clamp01((now - b.growStart) / 900);
      const s = Math.max(0.001, easeOutBack(t));
      b.cyl.scale.y = s;
      b.cyl.position.y = 0;                    // 组原点=柱底，缩放即底部生长
      b.cap.position.y = b.bh * s + 0.15;
      const pulse = b.hoverBoost ? 1.15 : 1;   // 仅 hover 轻微放大，无正弦呼吸
      b.cap.scale.set(pulse, pulse, pulse);
      // 柱身 emissive：hover 微亮，其余恒定（无 Top3 呼吸脉动）
      const targetEI = b.hoverBoost ? 0.35 : b.baseEmissive;
      if (Math.abs(b.cylMat.emissiveIntensity - targetEI) > 0.01) b.cylMat.emissiveIntensity = targetEI;
    });

    controls.update();
    renderer.render(scene, camera); // 直渲，无 Bloom 后处理
  };

  const startLoop = () => {
    if (rafId != null) return;
    rafId = requestAnimationFrame(animate);
    loopRunning = true;
  };
  const stopLoop = () => {
    if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
    loopRunning = false;
  };

  // 年份/指标变化后重建森林（与地图同源数据）
  const ensureForest = () => {
    const sig = DataStore.get('year') + ':' + DataStore.get('metric');
    if (_dataSig !== sig || bars.length === 0) {
      buildForest();
      _dataSig = sig;
    }
  };

  const open = async () => {
    document.getElementById('modal-overlay').classList.add('open');
    if (!initialized) await init();
    ensureForest();
    // 重开重播生长动画
    bars.forEach(b => { b.growStart = null; });
    startLoop();
  };

  const close = () => {
    document.getElementById('modal-overlay').classList.remove('open');
    stopLoop();
    if (tooltipEl) tooltipEl.style.display = 'none';
    if (hovered) { hovered.hoverBoost = false; hovered = null; }
  };

  const resize = () => {
    if (!initialized || !container) return;
    if (!document.getElementById('modal-overlay').classList.contains('open')) return;
    const w = container.clientWidth;
    const h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  };

  // ── 调试/验证钩子：投影所有柱顶到屏幕坐标（供 __SCREEN_DEBUG__ 聚合，自动化点击定位）──
  const getScreenBarPositions = () => {
    if (!initialized || !bars.length || !camera) return [];
    camera.updateMatrixWorld();
    const rect = renderer.domElement.getBoundingClientRect();
    if (!rect.width || !rect.height) return [];
    const v = new THREE_.Vector3();
    return bars.map(b => {
      b.group.getWorldPosition(v);
      v.y = b.bh * (b.cyl.scale.y || 1); // 柱顶高度（含生长缩放）
      v.project(camera);
      return {
        name: b.data.province,
        x: Math.round((v.x * 0.5 + 0.5) * rect.width + rect.left),
        y: Math.round((-v.y * 0.5 + 0.5) * rect.height + rect.top),
        production: b.data.production,
      };
    });
  };

  return { open, close, resize, getScreenBarPositions };
})();

// ── App: 主编排器 ──
const App = (() => {
  let _resizeTimer = null;
  let _resizeObserver = null;

  const bindUI = () => {
    document.querySelectorAll('.year-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.year-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        DataStore.set('year', parseInt(tab.dataset.year));
      });
    });
    document.querySelectorAll('.metric-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.metric-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        DataStore.set('metric', tab.dataset.metric);
      });
    });
    document.getElementById('map-locate-btn').addEventListener('click', () => MapModule.locate());
    document.getElementById('map-rotate-toggle').addEventListener('click', () => {
      const r = MapModule.toggleRotate();
      document.getElementById('map-rotate-toggle').textContent = r ? '暂停' : '旋转';
    });
    document.getElementById('flyline-toggle').addEventListener('click', () => {
      const enabled = MapModule.toggleFlyline();
      document.getElementById('flyline-toggle').classList.toggle('active', enabled);
      document.getElementById('flyline-toggle').textContent = enabled ? '飞线' : '飞线关';
    });
    document.getElementById('forest-btn').addEventListener('click', () => ThreeForest.open());
    document.getElementById('modal-close').addEventListener('click', () => ThreeForest.close());
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) ThreeForest.close();
    });
    // 省份详情抽屉
    document.getElementById('drawer-close').addEventListener('click', () => DrawerModule.close());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') DrawerModule.close();
    });
    // ── 运行时调试/验证钩子（仅 URL 带 ?debug 时注入，生产环境零污染）：──
    // 统一聚合 __SCREEN_DEBUG__ = { map:{...}, forest:{...}, version, ts }，
    // map.getBarScreenPositions() 用 echarts-gl 官方 pickObject 扫描柱体屏幕坐标（与 hover/click 同一套机制），
    // forest.getScreenBarPositions() 用 Three.js 相机投影柱顶坐标；供自动化测试定位点击。
    // 所有函数均为惰性闭包（调用时才读取当前渲染状态，未初始化返回 []），不侵入业务逻辑。
    if (new URLSearchParams(location.search).has('debug')) {
      window.__SCREEN_DEBUG__ = {
        version: '2.0',
        ts: Date.now(),
        map: {
          getBarScreenPositions: () => MapModule.getScreenBarPositions ? MapModule.getScreenBarPositions() : [],
          bars: () => MapModule.getScreenBarPositions ? MapModule.getScreenBarPositions() : [],
          chart: () => MapModule.rawChart ? MapModule.rawChart() : null,
        },
        forest: {
          getScreenBarPositions: () => ThreeForest.getScreenBarPositions ? ThreeForest.getScreenBarPositions() : [],
          bars: () => ThreeForest.getScreenBarPositions ? ThreeForest.getScreenBarPositions() : [],
        },
        // 兼容旧键（历史脚本可能引用）
        mapBars: () => MapModule.getScreenBarPositions ? MapModule.getScreenBarPositions() : [],
        forestBars: () => ThreeForest.getScreenBarPositions ? ThreeForest.getScreenBarPositions() : [],
        mapChart: () => MapModule.rawChart ? MapModule.rawChart() : null,
      };
    }
  };

  const load = async () => {
    const barFill = document.getElementById('loading-bar-fill');
    const setPhase = (pct, text) => {
      barFill.style.width = pct + '%';
      document.getElementById('loading-text').textContent = text;
    };
    try {
      setPhase(10, 'LOADING DATA...');
      await DataStore.load();
      // 数据源状态提示（API / STATIC）
      const dsEl = document.getElementById('data-source-indicator');
      if (dsEl) {
        const isApi = DataStore.getDataSource() === 'api';
        dsEl.textContent = isApi ? 'API' : 'STATIC';
        dsEl.title = isApi ? ('数据源: 后端 API (' + APP_CONFIG.apiBase + '/api/dashboard)') : '数据源: 本地静态文件 (dashboard_data.json)';
        dsEl.style.color = isApi ? 'var(--accent-cyan)' : 'var(--text-muted)';
        console.log('[DigitalTwin] 数据源: ' + (isApi ? 'API' : 'STATIC'));
      }
      setPhase(40, 'INITIALIZING MAP...');
      await MapModule.init();
      setPhase(55, 'INITIALIZING SCAN RING...');
      await ScanRing.init();
      setPhase(70, 'RENDERING PANELS...');
      KPIModule.render();
      StructureModule.render();
      RankingModule.render();
      setPhase(100, 'READY');
      setTimeout(() => {
        document.getElementById('loading-overlay').classList.add('hidden');
      }, 400);
      // 启动实时数据
      DataStore.startRealtime();
    } catch (err) {
      console.error('[DigitalTwin] 初始化失败:', err);
      document.getElementById('loading-text').textContent = '⚠ 加载失败: ' + (err.message || '未知错误');
      document.getElementById('loading-text').style.color = '#ef4444';
      setTimeout(() => {
        document.getElementById('loading-overlay').classList.add('hidden');
      }, 3000);
    }
  };

  const init = () => {
    // 15s 安全兜底
    setTimeout(() => {
      const overlay = document.getElementById('loading-overlay');
      if (overlay && !overlay.classList.contains('hidden')) {
        overlay.classList.add('hidden');
      }
    }, 15000);

    initBgCanvas();
    bindUI();

    // 订阅变化
    DataStore.on('change', ({ key }) => {
      if (key === 'year' || key === 'metric') {
        MapModule.render();
        KPIModule.render();
        StructureModule.render();
        RankingModule.render();
      }
    });

    // 订阅实时更新
    DataStore.on('realtime:update', (kpi) => {
      KPIModule.updateRealtime(kpi);
      // 排名微调
      RankingModule.render();
      // 抽屉打开时只更新抽屉内数字，不重开抽屉
      DrawerModule.updateRealtime();
      // 柱高实时微调：±2% 脉冲（增量 setOption，仅更新 data；生长动画进行中自动跳过）
      MapModule.applyRealtimePulse();
    });

    // ResizeObserver 替代 window.resize（带兼容性防御）
    if (typeof ResizeObserver !== 'undefined') {
      _resizeObserver = new ResizeObserver(() => {
        clearTimeout(_resizeTimer);
        _resizeTimer = setTimeout(() => {
          MapModule.resize();
          ScanRing.resize();
          ThreeForest.resize();
        }, 200);
      });
      _resizeObserver.observe(document.getElementById('map-area'));
    } else {
      window.addEventListener('resize', () => {
        clearTimeout(_resizeTimer);
        _resizeTimer = setTimeout(() => {
          MapModule.resize();
          ScanRing.resize();
          ThreeForest.resize();
        }, 200);
      });
    }

    load();
  };

  return { init };
})();

// 启动
if (document.readyState === 'complete') {
  App.init();
} else {
  window.addEventListener('load', () => setTimeout(App.init, 50));
}
</script>
</body>
