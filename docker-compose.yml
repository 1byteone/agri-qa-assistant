version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AGNES_AI_API_KEY=${AGNES_AI_API_KEY}
      - AGNES_AI_BASE_URL=${AGNES_AI_BASE_URL:-https://api.agnes-ai.cn/v1}
      - AGNES_AI_CHAT_MODEL=${AGNES_AI_CHAT_MODEL:-agnes-2.5-flash}
      - RAG_EMBEDDING_MODE=${RAG_EMBEDDING_MODE:-local}
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - SQLITE_DB_URL=sqlite+aiosqlite:///./data/agri_qa.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - DEBUG=false
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r=requests.get('http://localhost:8000/health'); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
