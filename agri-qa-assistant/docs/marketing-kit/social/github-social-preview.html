<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriQA Assistant - GitHub Social Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1280px; height: 640px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0b3d2e 0%, #17613c 40%, #2a8f5e 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* Liquid Glass blobs */
    .blob1 { position: absolute; top: -100px; right: -50px; width: 500px; height: 500px; border-radius: 50%; background: rgba(255,255,255,0.06); filter: blur(40px); }
    .blob2 { position: absolute; bottom: -120px; left: -60px; width: 400px; height: 400px; border-radius: 50%; background: rgba(255,255,255,0.05); filter: blur(50px); }
    .content { position: relative; z-index: 2; padding: 60px; max-width: 1000px; }
    .logo { display: inline-flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.12); backdrop-filter: blur(12px); padding: 10px 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); font-size: 28px; font-weight: 800; margin-bottom: 40px; }
    .logo .icon { font-size: 32px; }
    h1 { font-size: 64px; font-weight: 900; line-height: 1.15; margin-bottom: 20px; letter-spacing: -1px; }
    h1 .accent { color: #8ee6b0; }
    p.sub { font-size: 24px; color: rgba(255,255,255,0.85); line-height: 1.5; max-width: 800px; margin-bottom: 40px; }
    .features { display: flex; gap: 16px; flex-wrap: wrap; }
    .feature { background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.18); border-radius: 14px; padding: 12px 20px; font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .footer { position: absolute; bottom: 30px; left: 60px; right: 60px; display: flex; justify-content: space-between; font-size: 14px; color: rgba(255,255,255,0.6); z-index: 2; }
  </style>
</head>
<body>
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="content">
    <div class="logo"><span class="icon">🌾</span> AgriQA Assistant</div>
    <h1>智慧农业<br><span class="accent">智能问答系统</span></h1>
    <p class="sub">基于 LangGraph 智能体架构 · ChromaDB 私有知识库 · Apple Liquid Glass 设计</p>
    <div class="features">
      <div class="feature">💬 智能对话</div>
      <div class="feature">🔍 作物诊断</div>
      <div class="feature">📅 农事日历</div>
      <div class="feature">📋 政策咨询</div>
      <div class="feature">📚 RAG 知识库</div>
    </div>
  </div>
  <div class="footer">
    <span>github.com/1byteone/agri-qa-assistant</span>
    <span>江西农业大学 · 2026</span>
  </div>
</body>
</html>
