<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      .bg-circle { fill: #A6192E; }
      .white-text { fill: #FFFFFF; font-family: Arial, sans-serif; font-weight: bold; }
      .gold-text { fill: #F5C242; font-family: Arial, sans-serif; }
    </style>
    <!-- subtle inner shadow via semi-transparent circle -->
    <filter id="inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- outer background circle -->
  <circle cx="60" cy="60" r="56" fill="#A6192E"/>
  <!-- thin gold ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#F5C242" stroke-width="1.5" opacity="0.7"/>
  <!-- JAU letters -->
  <text x="60" y="72" text-anchor="middle" class="white-text" font-size="38" letter-spacing="2">JAU</text>
  <!-- year below -->
  <text x="60" y="90" text-anchor="middle" class="gold-text" font-size="13" letter-spacing="3" opacity="0.9">1905</text>
</svg>